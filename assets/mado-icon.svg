<?xml version="1.0" encoding="UTF-8"?>
<!--
  mado app icon — the pleme-io swerve mark in mado's frost/Vellum identity.

  The hero is the canonical pleme-io "swerve": the curve-and-counter-curve
  stroke from `ishou_tokens::Brand::pleme().swerve`
  (path_d "M 8 10 C 14 46, 30 52, 32 32 C 34 12, 50 18, 56 54", 64-viewbox,
  stroke 10, round caps) — the feather/tear-like signature stamp. Rendered
  here on a matte-Nord Vellum squircle in frost cyan, so mado reads as a
  pleme-io app at a glance in Spotlight / Launchpad / the Dock.

  Source of truth for the swerve geometry is ishou Brand; this asset stamps
  that exact path. Regenerate the .icns from this SVG (substrate
  mkDarwinAppBundle / the iconset pipeline).
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vellum night: deep matte warm-black, a touch of frost at the top. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1B12"/>
      <stop offset="0.55" stop-color="#16140E"/>
      <stop offset="1" stop-color="#0E0C08"/>
    </linearGradient>
    <!-- Frost stroke: ice-cyan into a colder deep cyan for depth. -->
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7E3E0"/>
      <stop offset="0.5" stop-color="#A6CBC8"/>
      <stop offset="1" stop-color="#7FB0AE"/>
    </linearGradient>
    <!-- Soft frost glow behind the swerve. -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS squircle (rounded-superellipse-ish via a generous corner radius). -->
  <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#bg)"/>
  <!-- A hair-thin frost rim so the tile reads crisp on dark Docks. -->
  <rect x="64.5" y="64.5" width="895" height="895" rx="207.5" ry="207.5"
        fill="none" stroke="#2C2A22" stroke-width="3"/>

  <!-- The pleme-io swerve, scaled from the 64-viewbox into the icon center
       (64 × 10 = 640 wide; centered: (1024-640)/2 = 192) and stroked frost. -->
  <g transform="translate(192,192) scale(10)" filter="url(#glow)">
    <path d="M 8 10 C 14 46, 30 52, 32 32 C 34 12, 50 18, 56 54"
          fill="none" stroke="url(#frost)" stroke-width="9.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- A single snowflake accent at the swerve's cold tail — mado's frost note,
       small so the swerve stays the hero. -->
  <g transform="translate(748,690)" fill="#E2DBC8" opacity="0.92">
    <circle cx="0" cy="0" r="9"/>
    <g stroke="#E2DBC8" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-19" y1="-11" x2="19" y2="11"/>
      <line x1="-19" y1="11" x2="19" y2="-11"/>
    </g>
  </g>
</svg>
