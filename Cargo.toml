[package]
name = "mado"
version = "0.1.165"
edition = "2024"
rust-version = "1.91.0"
description = "Mado (窓) — GPU-rendered terminal emulator following Ghostty's philosophy"
homepage = "https://github.com/pleme-io/mado"
repository = "https://github.com/pleme-io/mado"
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/mado"
categories = ["command-line-utilities"]
keywords = ["terminal", "emulator", "gpu", "wgpu", "vte"]
# The crates.io name `mado` is owned by another publisher (bennobuilder,
# v0.0.15), so `publish = true` could never succeed — every release run took
# the 403 not-an-owner arm. False makes the manifest honest and the run a
# clean skip. If mado should reach crates.io, the remedy is a rename of the
# PACKAGE to `pleme-io-mado` (fleet precedent: pleme-dojo, pleme-tear) with
# `[[bin]] name = "mado"` keeping the binary name; that is a deliberate
# decision about the crate's public identity, not a mechanical fix, so it is
# left open rather than taken here.
publish = false

# The pure `motion` animation algebra is exposed as a library target so
# `benches/*.rs` (separate crates) can link + bench it. The application
# itself is the bin (auto-detected from `src/main.rs`), which consumes
# `motion` via `use mado::motion;` (so `crate::motion::…` still resolves
# at every call site — see src/lib.rs + src/main.rs).
[lib]
name = "mado"
path = "src/lib.rs"

[[bench]]
name = "motion"
harness = false

[lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
# opt-level = 3 (speed), NOT "z" (size). Terminal hot paths are
# alloc-/branch-/cache-bound; size optimization disables loop
# unrolling, vectorisation, function inlining heuristics that the
# render and VT-parse paths benefit from. Mado is distributed via Nix
# so binary size is uninteresting; ~few MB saved is worth a measurable
# speed regression in build_text_buffers + build_rect_instances.
opt-level = 3
# panic = "abort" drops unwinding tables (~5% binary, marginal hot-path
# perf because unwind metadata is no longer carried on each
# `?`/Result-bubble site) and matches Ghostty / Alacritty / WezTerm's
# release shape. No code in mado depends on catch_unwind / UnwindSafe.
panic = "abort"
strip = true
# Don't carry debug-info eviction lookups in the release binary —
# nothing inspects backtraces in a release-shipped terminal.
debug = false
incremental = false
# Overflow checks off in release (default for release but explicit).
overflow-checks = false

[dependencies]
# Content-addressed clipboard + future attestation anchors.
# BLAKE3 is the pleme-io convergence-computing stack's canonical hash
# (tatara, tameshi, sekiban all use it) — keeping mado in the same
# algorithm family means session-stable clipboard hashes can cross
# MCP boundaries without re-hashing.
blake3 = "1"

# Typed URL parsing for prewarm deep-links (runbook / dashboard OpenUrl steps) —
# a `url::Url` field makes a malformed link parse-time-rejected before it reaches
# a PrewarmStep. Already in the tree transitively (izumi/madori); named direct so
# `src/prewarm/` can construct `Url`s. See docs/PREWARM.md.
url = "2"

# Scrollback regex search (`src/search.rs`, `SearchMatcher::Regex`). Same
# source-vs-build lesson as `url` above: regex was ALREADY in `Cargo.lock`
# transitively, which made it BUILT but not USABLE, and search.rs carried a
# ~570-line hand-rolled Thompson NFA for exactly that reason. Naming it direct
# deletes that engine. `regex-syntax` is regex's own AST parser, named direct
# so a compile failure can be classified into mado's typed `PatternError`
# instead of being matched against `regex::Error`'s human-readable string —
# `Error::Syntax` carries only a rendered message, so string-sniffing it would
# be the fragile alternative. Both already resolve here via regex itself, so
# declaring them adds no new crate to the lockfile.
regex = "1"
regex-syntax = "0.8"

# Pleme-io shared libraries
#
# crates.io only — a git dep here re-imports shidou's OWN dependency
# spellings and re-fragments them. cargo strips git sources on publish, so
# the PUBLISHED shidou depends on `shikumi ^0.1` from the registry (verified
# against the index, 2026-08-06), while the git checkout dragged a second
# shikumi into this lock alongside our own. Taking shidou from the registry
# is what collapses them.
shidou = { version = "0.1" }

# Kanshou — live process introspection over Unix sockets. Mado opens
# a kanshou socket on startup exposing the GUI's actual AppState
# (frame counters, session registry, config, embedded-tear runtime
# state). The MCP server in `mado mcp` connects to that socket and
# forwards queries — closing the "MCP returns process-local zeros
# while GUI renders 120 fps" class. See pleme-io/kanshou.
# kotae (答え) — the typed answer a machine gives a machine. mado 65 MCP
# tools answered through ok_json/err_json, whose `ok` flag is BINARY: an
# empty pane list and an unreachable daemon arrived as the same shape.
# kotae adds the four-way discriminant alongside `ok`, so no client breaks.
kotae = "0.1"
kanshou = "0.1"

# Katsuji (活字) — typed terminal emission. `mado banner` composes its wordmark
# from typed pieces rather than concatenating escapes, and the glyph set is the
# 21 chars render.rs synthesises as GPU rects; the other 139 in the same Unicode
# block have no geometry and render as tofu. `Crisp` has no variant for one, so
# the banner cannot name a glyph mado itself cannot draw.
katsuji = "0.1"

# Macro-farm-emitted derive — `#[derive(InvalidatingSetter)]` with
# `#[invalidating_setter]` field opt-in. Replaces the hand-written
# cache-invalidating setters on TerminalRenderer (selection_bg,
# cursor_color, reduce_motion, colorblind_mode, bold_is_bright,
# ansi_colors). Generated by `tatara-rust-forge catalog-instantiate`
# at github.com/pleme-io/tatara-rust-ast.
pleme-invalidating-setter-derive = "0.1"

# Macro-farm-emitted paired round-trip derive. `#[derive(KindStr)]` folds a
# unit-variant enum into inverse `as_str`/`from_str_kind` methods from
# per-variant `#[kind(name = "...", alias = "...")]` attrs — one authored
# table instead of two hand-kept inverse match arms where a dropped arm is a
# silent round-trip bug. Generated by `tatara-rust-forge` at
# github.com/pleme-io/tatara-rust-ast.
pleme-kindstr-derive = "0.1"

# Macro-farm-emitted byte-mode sibling of `pleme-kindstr-derive`.
# `#[derive(KindByte)]` folds a unit-variant enum into the
# `as_str`/`from_str_kind` pair PLUS `as_byte`/`from_byte` from per-variant
# `#[kind(byte = N)]` attrs — one authored byte table instead of two hand-kept
# inverse match arms. Used by PromptKind's OSC-133 A/B/C/D byte round-trip.
# Generated by `tatara-rust-forge` at github.com/pleme-io/tatara-rust-ast.
pleme-kindbyte-derive = "0.1"

# ★★ EMITTER SUBSTRATE: `#[derive(FleetThemed)]` mechanizes the
# `ishou_tokens::FleetThemedConfig::from_fleet` constructor. mado authored
# this derive (turning its own flagship hand-written impl into one derive
# line + `#[fleet(…)]` field attributes); rollout agents adopt it across
# the fleet. See github.com/pleme-io/pleme-fleet-themed-derive.
pleme-fleet-themed-derive = "0.1"

# Mechanical `ALL` / `all()` registries emitted from unit enums via
# `#[derive(AllVariants)]` — one authored variant list, never a hand const
# a new variant can silently drop. Promoted from dev-dependencies (2026-07-09):
# non-test catalogs (fibers::Subject, the izumi-catalog idiom) now consume it,
# not just the ux::modes test mirror enums. Proc-macro — build-time only, zero
# runtime / binary cost. See github.com/pleme-io/pleme-allvariants-derive.
pleme-allvariants-derive = "0.1"

garasu = "0.1"
# 0.1.13 is a REQUIREMENT, not a bump: RenderCallback::needs_frame lands
# there, and mado overrides it. An older madori compiles but never asks,
# so the override would be dead code and the idle repaint would return.
madori = "0.1.15"
shikumi = { version = "0.1", features = ["cli"] }
# izumi (泉) — the fresh-source board substrate: the generalized extraction of
# mado's Ctrl-S suggestion plane (Item/Store/Engine/Environment algebra, the
# 25 generic providers, the shikumi BoardConfig surface). mado's `suggest::`
# module is now a thin shim over these three crates; the snapshot magic
# `b"mado-suggest v1\n"` + the YAML schema stay byte-compatible.
# crates.io, NOT a git+rev pin. izumi ships through ★★ AUTO-RELEASE — a merge
# to main bumps the workspace and publishes all five crates in dependency order
# — so the released version IS the distribution channel and a rev pin was just a
# second, hand-maintained one that drifted. 0.1.15 is the first release carrying
# the breathe-conflict category fix (izumi efd1607).
#
# Bumping these is now a version edit, not a 40-char sha: the three MUST move
# together (they share `workspace.package.version`, and a split pin is how you
# get "this method takes 4 arguments but 5 were supplied" against your own
# crate). Publishing a git-dep is impossible on crates.io anyway, so this is
# also what keeps izumi itself publishable.
izumi = { version = "0.1.15" }
izumi-sources = { version = "0.1.15" }
izumi-config = { version = "0.1.15" }
hasami = "0.1"
# Tsuuchi (通知) — the fleet notification primitive (rich vocabulary:
# sound / actions / attachment / id / Capabilities). The M4 unified
# side-effect drain routes every terminal-queued notification
# (OSC 9 / 777 / 99, BEL, OSC 1337 RequestAttention) through the
# focus-aware NotificationCenter (src/notify_center.rs) over the chosen
# backend — native UNUserNotificationCenter when bundled
# (src/notify_mac.rs, no Script-Editor popup), LogBackend elsewhere;
# osascript is opt-in only. ux::side_effects re-exports tsuuchi::Urgency
# so the OSC parse and dispatch layers share one urgency type. See
# docs/NOTIFICATIONS.md.
tsuuchi = "0.1"
# Tear multiplexer — typed types + UDS RPC client. mado uses these
# for the `mado tear-attach` mode (subscribe to a remote pane's
# byte stream + stream it to stdout for now; future Phase 3.1
# renders it in the GPU window). Phase 3 MVP of the mado⇄tear
# de-overlap roadmap — see theory/MADO-TEAR-M5.md.
# Pinned to the reap-on-exit rev (tear main, f9b1f39 — tear-core
# reaps fully-exited unwatched sessions, the session-leak fix; also
# carries the SpawnEnv seam mado's gui_tear_attach uses:
# `from_overrides` / `with_cwd` / `inproc.set_spawn_env` for the
# env-projection + PWD cwd-handshake). Rev is on tear main, so it
# resolves on CI + for downstream consumers.
tear-types = { version = "0.1", features = ["engate"] }
tear-core = { version = "0.1", features = ["engate"] }
tear-client = { version = "0.1", features = ["engate"] }
tear-config = "0.1"

# praça (praca) — typed session-orchestration substrate (project-root
# detection, frecency, project↔session bindings, cd-driven attach
# decision). FIRST INTEGRATION SLICE: only `praca::project::project_root`
# is consumed here, to derive deterministic emoji session names from the
# project root at spawn. Auto-attach-on-cd + the picker land in later
# phases. Same tear git source + rev as the tear-* crates above so cargo
# unifies the shared tear-types crate identity (one git source rule).
praca = "0.1"

# egaku — the fleet widget-geometry + widget typescape. Consumed today ONLY
# for `egaku::Rect` (the geometry type the `float` floating-browser module
# builds on — "no second Rect type", Op#1). SAME git source + rev as the
# `[patch.crates-io]` egaku pin below (and as irodzuki's egaku dep) so cargo
# unifies ONE egaku crate identity — a divergent rev is the documented E0463
# split-crate break. When the floating-window CHROME widget lands it consumes
# egaku's widget trait too (QUADRO T1); until then this is a geometry-only dep.
egaku = "0.1"

# nami-core — the pure-Rust web engine (DOM → CSS → layout → typed paint IR).
# Drives the RealBrowserBackend behind float::BrowserBackend (browser_engine.rs).
# namimado's NamiNativeEngine is bin-only (unreachable), so mado re-authors the
# ~40-line engine over nami-core's PUBLIC pipeline. default-features=false drops
# the `lisp` default (tatara-lisp) + never pulls the optional `config` (shikumi)
# feature — so NO shikumi-family rev to split (no E0463). `network` enables the
# todoku fetch client for navigate(). Rev-pinned to namimado's locked rev.
# nami-core no longer needs to move in lockstep with garasu: it takes
# garasu from crates.io now, as mado does, so cargo unifies them by semver
# instead of either crate having to know the other's pin.
# Published as `pleme-nami-core`: the bare `nami-core` on crates.io belongs to
# water-rs (the same org that owns the `mado` name), and their 0.3.2 exposes
# only `default`/`std` — so pointing at the bare name fails on unknown features,
# not on the name. Renaming here keeps every `use nami_core::…` untouched.
nami-core = { package = "pleme-nami-core", version = "0.1.13", default-features = false, features = ["network", "eval", "gpu"] }

# tatara-lisp — the Four-Lisps authoring engine. Consumed by the `float`
# module's `spec` border: `#[derive(DeriveTataraDomain)]` turns
# `(deffloatingbrowser …)` / `(defsnapzone …)` forms into typed specs
# (org Pillar 1: Rust owns types, tatara-lisp owns declarative authoring).
# Plain crates.io dep on the CANONICAL published tatara-lisp (0.3.3, published
# 2026-07-30 from pleme-io/tatara-lisp). The retired pleme-io/tatara sibling
# published the same crate names at 0.2.154 and is now `publish = false` —
# nothing here may resolve through it. mado's tatara-lisp surface is confined to
# `float::spec` (derive + `compile_typed`); no tatara-lisp TYPE crosses the vigy
# or nami-core boundary (mado touches `vigy::eval::*` through vigy's own paths
# and nami-core's `lisp` API is string-in/string-out), so those crates keeping
# their own tatara-lisp source is not an identity split mado can observe.
tatara-lisp = { version = "0.3.3" }

# Vigy — always-on tatara-lisp reconciler runtime, embedded in-process.
# Hosts small reconcilers ("vigies") that tick continuously to keep
# pieces of mado's state always-converging toward desired. Apps inside
# panes can register more vigies at runtime via the MCP tools (and via
# the OSC 1338 extension, future). See pleme-io/vigy for the primitive.
vigy = { version = "0.1", default-features = false, features = ["mcp"] }

# engate typed-attach primitive — mado's gui_tear_attach uses it to
# wrap the daemon-mode or embedded-mode tear Producer into one
# typestate-enforced attach lifecycle. branch=main pinned to match
# tear-types/-core/-client (otherwise cargo treats the two sources
# as separate crates and the trait identities don't unify).
engate-types = "0.1"
engate-attach = "0.1"
# Signal handling for the long-running `mado tear-attach` loop.
ctrlc = { version = "3", features = ["termination"] }
awase = "0.1"
# (kaname was declared here and DROPPED 2026-08-06: zero `kaname::` call sites
# in `src/`, so it was compiled and linked into every build for nothing. The
# MCP server is `rmcp` 0.15 directly — see `src/mcp.rs`.)
# kanchi (感知) — shared environment-discovery primitive. mado's auto_detect
# axes are declared via kanchi::defaxes!; the platform FFI lives once in
# kanchi::probe. Git source (published at pleme-io/kanchi); pin a version when
# kanchi reaches crates.io.
kanchi = "0.1"
# (samba host-pacing moved into izumi — `izumi::pace::HostPacer` carries the
# LeakyBucket-per-host discipline; mado no longer depends on samba directly.)
# ishou-tokens — the typed colour-space + design-token primitive owns
# Nord for the fleet. The `wgpu` feature exposes
# `impl From<LinearRgba> for wgpu_types::Color` so the gamma path is
# load-bearing at the type level: every wgpu::Color the renderer
# constructs goes through `Srgb::to_linear()` first. The previous
# direct-sRGB-to-wgpu construction (the cause of the washed-out gray
# background visible on Retina pre-M3) cannot recompile.
# Architecture: pleme-io/theory/THEME-ARCHITECTURE.md
ishou-tokens = { version = "0.1", features = ["wgpu"] }
# wadachi (轍) directory frecency — READER ONLY. mado calls pleme_io_wadachi::
# top_n / resolve in-process for the DirPicker overlay + MCP tools, and NEVER
# records (the shell owns recording — single-recorder rule). Published crate,
# NOT git: a git workspace-member dep breaks gen's lockfile-builder; 0.1.4 is
# root-level. Lib imports as `pleme_io_wadachi`.
pleme-io-wadachi = "0.1.4"
# irodzuki — typed base16 color schemes + curated 16-color ANSI
# palettes. The 8 terminal-grade presets (nord, dracula, ...) live
# here in `irodzuki::presets`, NOT in mado. Mado's theme.rs is a
# thin shim that adapts irodzuki::ColorScheme → mado's
# terminal::Color (u8 RGB) for the renderer.
# REV-PINNED (2026-07-02): d3bfe78 pins irodzuki's own egaku dep to the
# shikumi-family rev. Before this, irodzuki's unpinned egaku floated to
# branch HEAD on CI cargo updates while mado family-pins egaku — a split-rev
# duplicate egaku that broke every nix build with E0463 "can't find crate
# for irodzuki" (v0.1.49..v0.1.53, bisected 2026-07-02). Advance together
# with the family pin. NOTE: bulk-pinning ALL unpinned pleme-io deps here
# was tried and REVERTED — a ?rev= spelling splits identity against
# transitive plain-URL references (engate_types trait mismatch); the
# hermetic fix is per-UPSTREAM-repo pinning like irodzuki's, one family at
# a time.
irodzuki = "0.1"
# server + transport-io: the `mado mcp` stdio server. client +
# transport-child-process: the `mado e2e` L2 smoke driver, which
# spawns `mado mcp` as a child and drives it as a typed rmcp client
# (docs/INTEGRATION-TESTING.md §L2).
rmcp = { version = "0.15", features = ["server", "transport-io", "client", "transport-child-process"] }
schemars = "0.8"

# GPU rendering (via garasu, but needed for direct wgpu types in render code)
wgpu = "25"

# Re-export glyphon for text area construction
glyphon = "0.9"

# Used directly by main.rs for the transient EventLoop in the
# adaptive-posture detection path (before madori owns one).
winit = "0.30"

# Terminal emulation
vte = "0.15"

# CLI and config
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
dirs = "6.0"

# GPU data upload
bytemuck = { version = "1", features = ["derive"] }

# Unicode support
unicode-width = "0.2"

# Battle-tested replacements for hand-rolled implementations
data-encoding = "2"
linkify = "0.10"
open = "5"

# Image decoding for Kitty graphics protocol
image = { version = "0.25", default-features = false, features = ["png"] }

# PTY and process management
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "net", "time"] }
libc = "0.2"

# ── ★ NOT USED DIRECTLY. PRESENT TO TURN ON `std`. ──────────────────────────
#
# tinyvec 1.13.0 (published 2026-09-03) does not compile with `alloc` and
# without `std`: `src/tinyvec.rs:3` does `use alloc::vec::{self, Vec}`, which
# brings the MODULE `vec` into scope and shadows the `vec!` MACRO, and line
# 710 then calls `vec![...]`. Most consumers enable std, which is how upstream
# shipped it; the fleet build resolved `alloc` + `default` and no `std`, so it
# failed — taking mado, then system-path, then the whole plo system with it,
# and leaving the gitops loop DEGRADED for 16 consecutive cycles.
#
# ★ A LOCK PIN DOES NOT HOLD. `cargo update -p tinyvec --precise 1.12.0` fixed
# it for exactly one release: mado's auto-release regenerated Cargo.lock and
# re-resolved 1.13.0. The durable fix is a feature, not a version — cargo
# unifies features across the graph, so declaring `std` here turns it on for
# whichever transitive dependency actually pulls tinyvec in, and the crate
# compiles at any version.
#
# Fixing the CAUSE rather than pinning away from it also means we keep taking
# tinyvec updates instead of freezing at 1.12 forever.
tinyvec = { version = "1", features = ["std"] }

# mimalloc — Microsoft's general-purpose allocator. Ghostty / foot /
# wezterm all swap the system allocator for a tuned one because the
# terminal hot path allocates aggressively (per-cell buffers, per-line
# snapshots, per-frame text_areas, per-row String accumulators). On
# small-object churn mimalloc beats jemalloc with a lighter dependency
# footprint. ~5–15% wall-clock improvement across mado's allocation-
# bound workloads (build_text_buffers, snapshot copy, scrollback push).
mimalloc = { version = "0.1", default-features = false }

# Bounded LRU cache for the per-frame shape cache. Refterm's single
# biggest insight: keying shaped glyph runs by their UTF-8 byte text +
# attrs avoids ~99% of HarfBuzz/cosmic-text shape calls in a typical
# interactive session (prompt, scrollback, command output repeat).
# Bounded capacity prevents pathological VRAM growth on streams of
# unique runs (random-byte spam).
lru = "0.12"

# parking_lot — faster Mutex / RwLock primitives (no LockResult
# wrapper, ~30% faster acquire on the uncontended path, true reader-
# writer semantics on RwLock that the std::sync impl doesn't fully
# guarantee on every platform). mado's terminal lock is a hot
# contention point between PTY pump (writer) and snapshot/MCP (many
# readers); using a real RwLock lets multiple readers observe state
# concurrently without serialising behind a Mutex.
parking_lot = "0.12"

# Scenario harness — `mado scenario-run` consumes YAML so the format is
# operator-facing, not test-only. serde_yaml_ng is the actively-maintained
# successor to the (now-deprecated) serde_yaml crate; pleme-io tooling
# (sekkei, etc.) already standardised on it.
serde_yaml_ng = "0.10"

pollster = { version = "0.4", optional = true }

# engawa stack — typed render-graph IR (engawa, also the owner of
# the underline/decoration vocabulary) + the wgpu dispatcher and
# typed effect catalog (engawa-wgpu). Every post effect — snow
# included — dispatches through ONE engawa graph per frame; the
# engawa-snow overlay crate was absorbed by the catalog (M3).
engawa = "0.1"
engawa-wgpu = "0.1"

# Sixel decode (DCS q … ST → RGBA). Feeds the SAME texture upload path
# as Kitty images: a decoded sixel becomes a KittyImage + ImagePlacement.
icy_sixel = "0.5.0"

# macOS platform integration (safe Rust wrappers for Cocoa APIs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults", "NSBundle", "NSError", "NSUUID", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSDockTile", "NSResponder", "NSScreen", "NSSound", "NSGraphics", "NSProgressIndicator", "NSView", "NSMenu", "NSMenuItem"] }
# Native notifications via UNUserNotificationCenter — the mado-attributed,
# rich path that replaces the osascript/Script-Editor shell-out. See
# src/notify_mac.rs + docs/NOTIFICATIONS.md. Actions/attachments (the
# delegate-routed tier) land in M1 with more features.

[dev-dependencies]
tempfile = "3"
proptest = "1"
# Perf-regression benches for the pure `motion` algebra (benches/motion.rs).
criterion = { version = "0.5", default-features = false }
# `test-util` (the paused-clock `#[tokio::test(start_paused = true)]`) is
# test-only — it lets the livestream refresh-loop tests advance the interval
# clock deterministically without real sleeps. Dev-dep so it never touches the
# shipped binary build.
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "time", "sync"] }
# pleme-allvariants-derive was promoted to [dependencies] (2026-07-09) — the
# ux::modes test mirror enums still use it, but fibers::Subject now consumes
# `ALL` in non-test catalog code, so it can no longer be dev-only.
# tear-core + tear-daemon are pulled in for:
#   - tests/tear_attach_integration.rs (Phase-3-MVP cross-process)
#   - tests/mcp_cross_process.rs (mado bin spawned as `mado mcp`)
#   - tear_discovery::tests::discovers_a_real_in_process_daemon
# The binary itself only needs tear-types + tear-client.
# Same SpawnEnv-seam rev as the runtime deps above — a single tear
# git source so cargo unifies the crate identities (a divergent rev
# would split tear-types into two crates and break the trait unify).
tear-core = "0.1"
tear-daemon = "0.1"
# Cross-process MCP integration test (tests/mcp_cross_process.rs)
# uses the rmcp client + child-process transport. Those features now
# ship in the main dependency (the `mado e2e` subcommand is a typed
# rmcp client), so no dev-only rmcp entry is needed.

[features]
default = []
# Opt-in: runs Layer-2 headless-wgpu pixel-readback tests that
# need a real GPU adapter. cid + dev workstations have one; CI
# runners typically don't, so default is off. Match
# garasu/headless gating.
#
# Activates pollster as a runtime dep (sync wrapper around
# garasu's async GpuContext::new) — only needed inside the
# gpu_tests code paths, so production builds keep pollster out
# of the binary.
gpu_tests = ["dep:pollster"]

[patch.crates-io]
# ★ garasu is NOT patched — it resolves from crates.io via the plain
# `garasu = "0.1"` dependency above, and that is the point.
#
# A git rev pin cannot be unified by cargo: nami-core also depends on
# garasu, so mado's pin and nami-core's pin were two separate sources and
# the graph carried TWO garasu whenever they disagreed — every cross-crate
# `GpuContext` an "expected garasu::context::GpuContext, found GpuContext"
# mismatch. Measured 2026-07-31 by bumping one and not the other.
#
# A semver range has no such failure mode: cargo unifies compatible
# versions from one registry automatically, so neither crate needs to know
# what the other pinned and there is no lockstep bump to forget. The pin
# was only ever a workaround for garasu being unpublished; auto-release
# publishes it (0.1.7 carries `garasu::pane`), so the workaround is gone.
#
# ★ shikumi is NO LONGER PATCHED either (2026-08-06, operator ruling:
# shikumi comes from crates, not git). The removed pin was an
# "INTERIM FAMILY PIN (2026-06-27)" taken when shikumi main had lost
# `closed_axis_label_string_surface` / `serde_via_display_fromstr` and
# `discovery::Format`'s Display/FromStr. All three are back on main —
# verified before removing it — so the pin had outlived its cause by six
# weeks. It resolves from crates.io through the plain `shikumi = "0.1"`
# dependency above, for exactly the garasu reason spelled out above:
# measured that day, shikumi was reached FOUR incompatible ways across the
# fleet (mado `rev`, shidou `version+git+rev`, tear `branch=main`, an older
# shidou by bare `git`), so no two crates could exchange a shikumi type.
# shidou and tear moved to the registry in the same sweep.
# ★ egaku is NO LONGER PATCHED either (2026-08-07). The pin existed to hold
# mado and irodzuki on ONE egaku rev; both now take `egaku = "0.1"` from
# crates.io, so cargo unifies them by semver and the rev-pin's whole failure
# mode (a divergent rev = the documented E0463 split-crate break) is
# unrepresentable rather than merely avoided.
