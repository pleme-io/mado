name: basic-echo
description: |
  The smallest possible scenario — a shell starts, echo runs, output
  appears. Proves the PTY → vte → Terminal chain is alive and that
  `Session::send_input` writes reach the child correctly.
cols: 40
rows: 6
shell: /bin/sh
steps:
  - kind: send
    text: "stty -echo; PS1=''\n"
  - kind: wait_ms
    ms: 50
  - kind: send
    text: "echo MADO_BASIC_ECHO\n"
  - kind: wait_for_text
    text: "MADO_BASIC_ECHO"
    timeout_ms: 500
expect:
  frame_hash: "0cac6864e3ac41561e4a9d4f2d04e82d924eccd98680551c9970a21794b03a09"
  text_contains:
    - "MADO_BASIC_ECHO"
  cursor:
    visible: true
  cols: 40
  rows: 6
