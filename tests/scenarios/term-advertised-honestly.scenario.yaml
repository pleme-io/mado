name: term-advertised-honestly
description: |
  Capability-honest TERM (caps.rs): TERM is a PROJECTION of
  `TerminalCaps`, never a hand-picked string. The M3 revert condition
  written into this scenario at commit 7024fb3 has now FIRED:
  `caps::STYLED_UNDERLINE_IMPLEMENTED` is true (M2 attrs widening +
  M3 engawa decoration render geometry + pen-derived DECRQSS SGR
  report), so `TerminalCaps::advertised_term()` returns
  `xterm-ghostty` — whose terminfo claims `Smulx`/`Setulc`, both now
  real. The caps.rs honesty tests pin the same contract from the unit
  side (including the in-band SGR 4:3 → DECRQSS m → "4:3" probe);
  this scenario pins it end-to-end through the real PTY spawn env.

  Operator directive 2026-05-12 (ghostty compatibility) is hereby the
  live posture, not the destination. SSH-into-mado sessions
  independently downgrade via the blackmatter-shell `.zshenv` SSH hook
  (keyed off $SSH_CONNECTION, unset in headless scenario runs).
cols: 80
rows: 6
shell: /bin/sh
steps:
  - kind: send
    text: "echo TERM_IS_$TERM\n"
  - kind: wait_for_text
    text: "TERM_IS_"
    timeout_ms: 500
# L3 frame_hash golden intentionally absent: the grid text changed with
# the TERM upgrade, invalidating the old baseline. Re-record via
# MADO_GOLDEN_UPDATE=1 cargo test --test scenarios --features gpu_tests.
expect:
  frame_hash: "58a0bfaa7df894ac8cb0f5169cd2589b3a72b1a979594b7c1160c7bea011b8a6"
  text_contains:
    - "TERM_IS_xterm-ghostty"
  text_not_contains:
    - "TERM_IS_xterm-256color"
