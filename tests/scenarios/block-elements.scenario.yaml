name: block-elements
description: |
  Block-element characters (U+2580..U+259F) land in the terminal as
  distinct codepoints. atuin / ratatui / fzf emit these as popup
  borders. Combine with CSI 2J;H to render to a known absolute
  position so we can pin specific cells.
cols: 40
rows: 6
shell: /bin/sh
steps:
  - kind: send
    text: "stty -echo; PS1=''\n"
  - kind: wait_ms
    ms: 50
  - kind: send
    # Clear, home, then write ▌█▐ at row 0 col 0.
    text: "printf '\\e[2J\\e[H\\342\\226\\214\\342\\226\\210\\342\\226\\220'\n"
  - kind: wait_for_text
    text: "▌"
    timeout_ms: 500
expect:
  frame_hash: "5bc73cb3cfe55d2391c6b569a49e20b67540d202dd0cf31f5b7a40564986b880"
  cells:
    - row: 0
      col: 0
      ch: "▌"
    - row: 0
      col: 1
      ch: "█"
    - row: 0
      col: 2
      ch: "▐"
