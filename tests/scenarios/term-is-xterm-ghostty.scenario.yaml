name: term-is-xterm-ghostty
description: |
  Operator directive 2026-05-12: mado must be ghostty-compatible.
  This scenario pins that mado's PTY spawns every shell with
  TERM=xterm-ghostty so apps unlock ghostty's full terminfo
  repertoire (OSC 133 prompt marks, scrollback push/pop, Kitty
  graphics, synchronized output, truecolor, etc.) — the same
  surface starship / atuin / fzf already exploit in operator
  ghostty sessions.

  If a future refactor regresses to `xterm-256color` (or any other
  TERM), this test catches it. SSH-into-mado sessions are
  intentionally allowed to downgrade to xterm-256color via the
  blackmatter-shell `.zshenv` SSH hook — that hook keys off
  `$SSH_CONNECTION` which is unset in headless scenario runs.
cols: 80
rows: 6
shell: /bin/sh
steps:
  - kind: send
    text: "echo TERM_IS_$TERM\n"
  - kind: wait_for_text
    text: "TERM_IS_"
    timeout_ms: 500
expect:
  frame_hash: "8d88ee0d5fe95e48ba2a5051ec2c555fa7884cb2f170edadf9f4bb45d4acca9b"
  text_contains:
    - "TERM_IS_xterm-ghostty"
  text_not_contains:
    - "TERM_IS_xterm-256color"
