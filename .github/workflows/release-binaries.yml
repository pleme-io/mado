name: release-binaries

# THE SEMVER CUT-LINE ONLY (`v*` tag) — the official, versioned release.
# Builds mado for linux/macOS × x86_64/aarch64 via substrate's
# rust-binary-release.yml and attaches the per-platform artifacts (binaries +
# .sha256 + macOS .dmg/.zip + linux .tar.gz).
#
# ── THE AUTOBUMP JOB THAT USED TO LIVE HERE MOVED TO ci.yml (2026-08-06) ──
#
# This file also carried `push: branches: [main]` and an `autobump-macos` job
# whose only condition was `if: github.ref == 'refs/heads/main'` — a check on
# the shape of a ref, never on a result — so it published a DMG on every merge
# regardless of what the tests said. Measured at 1a85f80: ci run 31076457408
# FAILED on `cargo fmt --check` at 06:35Z while this file's run 31076457291
# had already published `Mado macos-arm64-r397-1a85f80` at 06:25Z. Same at
# cb082a2 (ci 31072544164 red, publish 31072544178 green).
#
# The job could not have been gated from here: a same-repo `needs: ci` is not
# expressible across workflow files. It now lives in ci.yml with
# `needs: [ci, release-tests]`. See that job's header for why `needs:` was
# chosen over `on: workflow_run:`.
#
# One icon source of truth (assets/mado-icon.svg) feeds both the CI .app
# (substrate path / the mado-release tool's resvg→iconutil) and the Nix
# mkDarwinAppBundle module path. See mado's README "Install" section.

on:
  push:
    tags: ['v*']

# ── Why this group exists even though the trigger is tags-only ────────────
#
# The audited defect was an ASYMMETRY: ci.yml cancelled superseded runs
# (`cancel-in-progress: true`) while this file had no `concurrency` block at
# all, so rapid pushes to main cancelled the VERIFICATION and let every
# artifact publish run to completion. That half is now moot — the publish is a
# job in ci.yml and inherits ci.yml's group.
#
# What is left here is the case a tags-only trigger still has: a tag that is
# force-moved, or deleted and re-pushed, starts a SECOND run for the same ref
# while the first is still uploading assets to the same release. Grouping by
# `github.ref` serializes those; distinct tags are distinct groups and never
# contend.
#
# `cancel-in-progress: false`, deliberately opposite to ci.yml: a semver
# release is not superseded by a re-push of its own tag, and cancelling one
# mid-upload is exactly how a release ends up half-populated. Queue it.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Official semver release on a v* tag (substrate reusable) ─────────────
  binaries:
    # Deliberately redundant against the tags-only trigger above: if a branch
    # trigger is ever re-added to this file, this guard is what stops a semver
    # release firing on a branch push instead of it happening silently.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: pleme-io/substrate/.github/workflows/rust-binary-release.yml@main
    with:
      binary-name: mado
      system-deps: "libxkbcommon-dev libwayland-dev libwayland-cursor0 pkg-config"
      app-bundle: true
      app-name: Mado
      bundle-id: io.pleme.mado
      icon-svg: assets/mado-icon.svg
      desktop-categories: "System;TerminalEmulator;"
    secrets: inherit
